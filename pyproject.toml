[project]
name = "deficitlens"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "numpy==2.5.3",
    "pandas==3.0.5",
    "scikit-learn==1.9.1",
    "joblib>=1.5",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "starlette>=1.0",
    "uvicorn>=0.30",
    "python-multipart>=0.0.20",
    "openpyxl>=3.1",
    "jinja2>=3.1",
    "pdfplumber>=0.11",
    "pytesseract==0.3.13",
    "pillow==12.3.0",
    "cryptography>=44",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx2>=2.13", "requests>=2.31", "ruff", "matplotlib"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
