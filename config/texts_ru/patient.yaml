        borderline: "Активный витамин B12 в пограничной зоне{value_part}."
      folate:
        low: "Фолаты снижены{value_part}: это может говорить об их нехватке."
        borderline: "Фолаты на пограничном уровне{value_part}."
      vitamin_B6:
