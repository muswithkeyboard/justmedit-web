        low: "Медь снижена{value_part}: это может говорить о её нехватке."
      ceruloplasmin:
        low: "Церулоплазмин снижен{value_part} — этот белок связан с обменом меди."
      CRP:
        high: "С-реактивный белок повышен{value_part}: так бывает при воспалении. При воспалении ферритин может выглядеть лучше, чем есть на самом деле."
      eGFR:
        low: "Показатель работы почек (рСКФ) снижен{value_part}: это стоит обсудить с врачом."
      TSH:
        high: "ТТГ повышен{value_part}: так бывает при сниженной работе щитовидной железы — это стоит обсудить с врачом."
      homocysteine:
        high: "Гомоцистеин повышен{value_part}: так бывает при нехватке витамина B12 или фолатов и по другим причинам."
      MMA:
        high: "Метилмалоновая кислота повышена{value_part}: так бывает при нехватке витамина B12."
      MCV:
        low: "Эритроциты мельче обычного{value_part}."
        high: "Эритроциты крупнее обычного{value_part}."
      MCH:
        low: "В эритроцитах меньше гемоглобина, чем обычно{value_part}."
      RDW:
        high: "Эритроциты заметно различаются по размеру. Так бывает при нехватке железа или витаминов и по другим причинам."

