    pregnancy: "При беременности пороги и причины изменений другие: программа оценивает только гемоглобин, нужна оценка врача."

  meaning:
    title: "Что это значит"
    about_anemia: "Гемоглобин переносит кислород. Когда его мало, бывают слабость, быстрая утомляемость, одышка при нагрузке."
    about_hidden: "Запас железа и витаминов может снижаться раньше, чем падает гемоглобин, — это называют скрытым дефицитом."
    nothing: "Среди сданных показателей нет отклонений, на которые программа обращает внимание."
    pregnancy: "При беременности программа сравнивает с порогом только гемоглобин; остальные показатели оценивает врач."
    pregnancy_unknown: "Если вы беременны, пороги гемоглобина другие — скажите об этом врачу."
    screening_elevated: "По общему анализу крови риск скрытой нехватки железа {risk}. Это оценка программы по похожим анализам других людей, а не измерение: проверить запас железа можно анализом на ферритин."
    screening_usual: "По общему анализу крови риск скрытой нехватки железа обычный. Это оценка программы, а не измерение."
    model_only: "Сочетание показателей может говорить о скрытом дефиците — это предположение программы, его нужно проверить анализами."
    unexplained_full: "Нехватки железа, витамина B12 и фолатов по сданным анализам не видно. В таких случаях врач проверяет другие причины: работу почек и щитовидной железы, воспаление."
    unexplained_b12_unrated: "Нехватки железа и фолатов по сданным анализам не видно. Витамин B12 программа по числу не оценивает — его оценит врач по нормам лаборатории. Врач также проверяет другие причины: работу почек и щитовидной железы, воспаление."
    unexplained_partial: "Причина снижения гемоглобина по сданным анализам не видна, но проверено не всё: врач подскажет, что стоит досдать."
    hemolysis_suspected: "Есть показатели, которые требуют обсуждения с врачом в связи с возможным изменением обмена или разрушения эритроцитов."
    flags:
      ferritin_masked_by_inflammation: "Есть признаки воспаления. На его фоне ферритин может выглядеть лучше, чем есть на самом деле, и скрывать нехватку железа — врачу понадобятся уточняющие анализы."
      normal_mcv_high_rdw: "Средний размер эритроцитов обычный, но сами клетки заметно различаются между собой. Так бывает, когда не хватает сразу нескольких веществ — например, железа и витамина B12 или фолатов."
      b12_gray_zone: "Общий витамин B12 сам по себе не даёт ответа — обсудите с врачом дополнительный анализ (активный B12 или гомоцистеин)."
      hemolysis_suspected: "Есть показатели, которые требуют обсуждения с врачом в связи с возможным изменением обмена или разрушения эритроцитов."
      hemolysis_signs: "Есть показатели, которые требуют обсуждения с врачом в связи с возможным изменением обмена или разрушения эритроцитов."
      microcytosis_not_iron: "Эритроциты мельче обычного или в них меньше гемоглобина, а запас железа не снижен. У такого сочетания бывают разные причины, в том числе наследственные особенности гемоглобина; разобраться поможет гематолог."
    values:
      ferritin:
        low: "Ферритин снижен{value_part}. Он показывает запас железа; это может говорить о нехватке железа."
        borderline: "Ферритин близок к нижней границе{value_part}: запас железа может быть невелик."
