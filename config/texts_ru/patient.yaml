    cause_ambiguous: "Причин может быть несколько; один из возможных вариантов — {cause}. Нужны уточняющие анализы."
    cause_cbc_only: "Данных мало: сдан только общий анализ крови. Возможная причина — {cause}, но это нужно проверить анализами."
    cause_cbc_unknown: "Данных мало: сдан только общий анализ крови. Причину по нему надёжно назвать нельзя."
