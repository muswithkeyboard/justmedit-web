version: "2026-10-05"

events:
  hb_drop:
    doctor:
      title_window: "Снижение гемоглобина"
      title_previous: "Снижение гемоглобина к предыдущему анализу"
      title_median: "Гемоглобин ниже медианы предыдущих анализов"
      text_window_one: "Hb снизился {prep} {from_value} до {to_value} г/л {span} (−{drop} г/л, −{drop_pct} %; {date_from} → {date_to})."
      text_window: "Hb снизился до {to_value} г/л {span}: медиана предыдущих анализов за ≤ {window} мес — {from_value} г/л (n = {n}, {date_from}–{date_prev}; −{drop} г/л, −{drop_pct} %)."
      text_previous: "Hb снизился по сравнению с предыдущим анализом: {from_value} → {to_value} г/л (−{drop} г/л, −{drop_pct} %; {date_from} → {date_to})."
      text_median: "Hb {to_value} г/л — ниже медианы предыдущих анализов за ≤ {window} мес: {from_value} г/л (n = {n}, {date_from}–{date_prev}; −{drop} г/л, −{drop_pct} %)."
      trend_note: "За всю историю ряд {trend} ({first_value} → {to_value} г/л, {date_first} → {date_to})."
      trend_up: "вырос"
      trend_flat: "в пределах «шума»"
      weak_note: "От медианы предыдущих анализов за ≤ {window} мес ({median} г/л) порог события не набран — к сведению."
      rule: "Порог события — снижение не меньше {min_g_l} г/л или {min_pct} % от медианы предыдущих анализов за ≤ {window} мес или от предыдущего анализа ({source})."
      pregnancy_note: "Часть анализов — при беременности: снижение Hb отчасти физиологично (гемодилюция), оценивать по порогам ВОЗ для триместра."
    patient:
      title_window: "Гемоглобин снизился"
      title_previous: "Гемоглобин снизился"
      title_median: "Гемоглобин ниже, чем в предыдущих анализах"
      text_window: "Гемоглобин {span} снизился — покажите историю врачу."
      text_previous: "Гемоглобин снизился по сравнению с предыдущим анализом — покажите историю врачу."
      text_median: "Гемоглобин в последнем анализе ниже, чем в предыдущих, — покажите историю врачу."
      text_pregnancy: "Гемоглобин ниже, чем в прошлых анализах. При беременности это часто связано с разведением крови — обсудите это с врачом, ведущим беременность."
  anemia_threshold_note: "Оба значения сравнены с порогом последнего анализа ({ctx_last}); в предыдущем ({ctx_prev}) порог был {thr_prev} г/л."
  anemia_new:
    doctor:
      title: "Появилась анемия по ВОЗ"
      text: "Hb {prev_hb} → {last_hb} г/л при пороге {threshold} г/л ({date_prev} → {date_last}; {source})."
    patient:
      title: "Гемоглобин стал ниже порога"
      text: "В последнем анализе гемоглобин ниже порога, а в предыдущем был не ниже — покажите историю врачу."
  anemia_resolved:
    doctor:
      title: "Hb снова не ниже порога ВОЗ"
      text: "Hb {prev_hb} → {last_hb} г/л при пороге {threshold} г/л ({date_prev} → {date_last}; {source}): критерия анемии в последнем анализе нет."
    patient:
      title: "Гемоглобин поднялся до порога"
      text: "В последнем анализе гемоглобин не ниже порога, а в предыдущем был ниже — покажите историю врачу: он решит, когда повторить анализ."
  hb_context_changed:
    doctor:
      title: "Сменился контекст оценки гемоглобина"
      text: "Hb {prev_hb} г/л ({date_prev}; {ctx_prev}, порог {thr_prev} г/л) → {last_hb} г/л ({date_last}; {ctx_last}, порог {thr_last} г/л): изменился контекст оценки ({what}) — пороги разные, сравнение условно. Критерий анемии в последнем анализе: {status} ({source})."
      what_pregnancy: "беременность"
      what_sex: "пол"
      what_pregnancy_sex: "беременность и пол"
      status_yes: "есть"
      status_no: "нет"
      context_F: "женщины"
      context_M: "мужчины"
      context_pregnant: "беременность, {trimester}"
      trimester_1: "I триместр"
      trimester_2: "II триместр"
      trimester_3: "III триместр"
      trimester_unknown: "триместр не указан"
    patient:
      title: "Изменились условия оценки"
      text: "С прошлого анализа изменились условия оценки ({what}): пороги для гемоглобина другие, поэтому сравнивать результаты напрямую нельзя — покажите историю врачу."
      what_pregnancy: "беременность"
      what_sex: "пол в анкете"
      what_pregnancy_sex: "беременность и пол в анкете"
  ferritin_drop:
    doctor:
      title: "Снижение ферритина"
      text: "Ферритин снизился {prep} {from_value} до {to_value} мкг/л {span} (−{drop_pct} %; {date_from} → {date_to}){crossing}. Порог события — падение не меньше {min_pct} % за ≤ {window} мес ({source}) или переход порога {thr_ru} / {thr_who} мкг/л при снижении больше «шума» ферритина.{crp_note}"
      crossing: "; ниже порога {thresholds}"
      crossing_many: "; ниже порогов {thresholds}"
      threshold_item: "{value} мкг/л ({label})"
      label_ru: "порог практики РФ"
      label_who: "ВОЗ 2020"
      crp_note: "СРБ {crp_from} на {date_from}, {crp_to} на {date_to} (воспаление — СРБ > {threshold} мг/л; {source}): ферритин — белок острой фазы и при воспалении завышается, сравнение условно."
      crp_value: "{value} мг/л"
      crp_missing: "не сдан"
    patient:
      title: "Запас железа снижается"
      text: "Запас железа (ферритин) снижается — обсудите с врачом."
      title_inflammation: "Ферритин изменился"
      text_inflammation: "Ферритин изменился, но на него влияло воспаление — покажите историю врачу."
  mcv_drift:
    doctor:
      title: "Сдвиг MCV"
      text: "MCV {verb} {prep} {from_value} до {to_value} фл {span} ({change} фл; {date_from} → {date_to}): сдвиг к {target} (микроцитоз < {micro} фл, макроцитоз > {macro} фл). Порог события — изменение не меньше {min_fl} фл от медианы предыдущих анализов за ≤ {window} мес ({source})."
      text_median: "MCV {verb} до {to_value} фл {span}: медиана предыдущих анализов за ≤ {window} мес — {from_value} фл (n = {n}, {date_from}–{date_prev}; {change} фл): сдвиг к {target} (микроцитоз < {micro} фл, макроцитоз > {macro} фл). Порог события — изменение не меньше {min_fl} фл от медианы предыдущих анализов за ≤ {window} мес ({source})."
      verb_down: "снизился"
      verb_up: "вырос"
      target_down: "микроцитозу"
      target_up: "макроцитозу"
    patient:
      title: "Размер эритроцитов изменился"
      text_down: "Средний размер эритроцитов {span} заметно уменьшился — покажите историю врачу."
      text_up: "Средний размер эритроцитов {span} заметно увеличился — покажите историю врачу."
  persistent_signal:
    doctor:
      title: "Повторяется сигнал «{topic}»"
      text: "Сигнал «{topic}» в {count} подряд ({dates}); последний: {signal} ({source})."
    patient:
      title: "Повторяется несколько раз подряд"
      text: "{topic} — так в {count} подряд. Обсудите это с врачом."
    topics_doctor:
      iron_stores: "ферритин ниже порога"
      iron_masked: "ферритин под маской воспаления"
      tsat: "НТЖ снижено"
      ret_he: "Ret-He снижен"
      b12: "B12 ниже порога или в серой зоне"
      active_b12: "активный B12 снижен"
      folate: "фолаты снижены"
      b6: "B6 снижен"
      copper: "медь снижена"
    topics_patient:
      iron_stores: "Запас железа (ферритин) ниже обычного"
      iron_masked: "На фоне воспаления запас железа трудно оценить"
      tsat: "Насыщение трансферрина железом ниже обычного"
      ret_he: "Показатель Ret-He ниже обычного"
      b12: "Витамин B12 ниже обычного или на границе"
      active_b12: "Активный витамин B12 ниже обычного"
      folate: "Фолаты ниже обычного"
      b6: "Витамин B6 ниже обычного"
      copper: "Медь ниже обычного"
  screening_repeat_no_ferritin:
    doctor:
      title: "Риск по скринингу ОАК повторяется, ферритин не сдан"
      text: "Риск скрытого дефицита железа по скринингу ОАК — {risks} в {count} ({dates}); ферритин ни разу не сдан: показаны ферритин и СРБ (скрининг по ОАК, модель проверена на данных NHANES)."
    patient:
      title: "Стоит проверить запас железа"
      text: "Уже в {count} программа предлагает проверить запас железа, а анализ на ферритин ещё не сдавали — обсудите его с врачом."
  cbc_stale:
    doctor:
      title: "ОАК давно не сдавали"
      text: "Последний ОАК — {date} ({ago} назад; срок «давно» — {months} мес, {source})."
    patient:
      title: "Анализ крови давно не сдавали"
      text: "Общий анализ крови последний раз сдавали {ago} назад — обсудите с врачом, когда его повторить."

